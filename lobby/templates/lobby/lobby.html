<link rel="stylesheet" href="/static/style.css">
<h1>Lobby - {{ user.username }}</h1>
<button onclick="location.href = '/'">Back to menu</button>
<p id="status"></p>
<h2>Online players</h2>

<ul id="players"></ul>

<div id="room" hidden>
  <h2>Room</h2>
  <p>Players: <span id="room-players"></span></p>
  <p>Map: <span id="room-map"></span></p>
  <button onclick="chooseMap('map_square.json')">Square</button>
  <button onclick="chooseMap('map_triangle.json')">Triangle</button>
  <button onclick="chooseMap('map_octagon.json')">Octagon</button>
  <p>Ready: <span id="room-ready"></span></p>
  <button onclick="sendReady()">Ready</button>
  <p id="room-status"></p>
</div>

<script>
  const myName = "{{ user.username }}";
  const socket = new WebSocket(location.origin.replace("http", "ws") + "/ws/lobby");

  socket.onclose = () => {
    document.getElementById("status").textContent = "Disconnected from the server";
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "players") {
      showPlayers(data.players);
    }

    if (data.type === "invite") {
      const accepted = confirm(data.from + " invites you to play. Accept?");
      socket.send(JSON.stringify({action: "answer", to: data.from, accepted: accepted}));
    }

    if (data.type === "answer") {
      if (data.accepted) {
        alert(data.from + " accepted");
      } else {
        alert(data.from + " refused");
      }
    }

    if (data.type === "room") {
      showRoom(data);
    }

    if (data.type === "room_closed") {
      document.getElementById("room").hidden = true;
      document.getElementById("status").textContent = data.from + " left the room";
    }

    if (data.type === "start") {
      location.href = "/?room=" + data.room_id;
    }
  };

  function showPlayers(players) {
    const list = document.getElementById("players");
    list.innerHTML = "";
    for (const name of players) {
      if (name === myName) {
        continue;
      }
      const item = document.createElement("li");
      item.textContent = name + " ";

      const button = document.createElement("button");
      button.className = "small";
      button.textContent = "Invite";
      button.onclick = () => {
        socket.send(JSON.stringify({action: "invite", to: name}));
      };

      item.appendChild(button);
      list.appendChild(item);
    }
    if (list.children.length === 0) {
      list.textContent = "No other player online";
    }
  }

  function showRoom(room) {
    document.getElementById("room").hidden = false;
    document.getElementById("room-players").textContent = room.players.join(" vs ");
    document.getElementById("room-map").textContent = room.map;
    document.getElementById("room-ready").textContent = room.ready.join(", ");
  }

  function chooseMap(map) {
    socket.send(JSON.stringify({action: "map", map: map}));
  }

  function sendReady() {
    socket.send(JSON.stringify({action: "ready"}));
  }

</script>
