<!doctype html>
<html>
<head>
  <title>Golfight</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="menu" class="screen">
    <h1>GOLFIGHT</h1>
    <p>Connected as <b>{{ user.username }}</b></p>
    <button onclick="startGame('/ws')">Solo</button>
    <button onclick="startGame('/ws/versus')">1 Vs 1 local</button>
    <button onclick="location.href = '/lobby/'">Online</button>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Logout</button>
    </form>
  </div>

  <div id="play" class="screen" hidden>
    <button id="back-button" class="small" onclick="backToMenu()">Back to menu</button>
    <div id="vote" hidden>
      <button class="small" onclick="sendVote('replay')">Replay</button>
      <button class="small" onclick="sendVote('quit')">Quit</button>
    </div>
    <canvas id="game" width="1024" height="768"></canvas>
  </div>

  <script src="/static/game.js"></script>
</body>
</html>
